<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%" style="background-color: #ffffff; font-family: sans-serif;">
  <defs>
    <style>
      .state-box { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 8; }
      .state-title { font-size: 13px; font-weight: bold; fill: #166534; text-anchor: middle; }
      .state-desc { font-size: 10px; fill: #334155; text-anchor: middle; }
      .init-circle { fill: #0f172a; }
      .trans-line { stroke: #334155; stroke-width: 1.6; marker-end: url(#arrow-state); }
      .trans-text { font-size: 9.5px; fill: #0f172a; font-weight: 500; }
    </style>
    <marker id="arrow-state" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Estado Inicial -->
  <circle cx="70" cy="220" r="14" class="init-circle" />
  <line x1="84" y1="220" x2="160" y2="220" class="trans-line" />
  <text x="90" y="212" class="trans-text">Boot / Init</text>

  <!-- Estado 1: Confort Climático -->
  <g transform="translate(160, 170)">
    <rect width="180" height="90" class="state-box" />
    <text x="90" y="32" class="state-title">Confort Biológico</text>
    <text x="90" y="52" class="state-desc">Temp en Rango Óptimo</text>
    <text x="90" y="68" class="state-desc">Compuerta 45° | Fan OFF</text>
  </g>

  <!-- Estado 2: Ventilación Pasiva -->
  <g transform="translate(470, 60)">
    <rect width="200" height="90" class="state-box" />
    <text x="100" y="32" class="state-title">Ventilación Pasiva</text>
    <text x="100" y="52" class="state-desc">T &gt; T_max (Temp Alta)</text>
    <text x="100" y="68" class="state-desc">Compuerta 90° | Fan OFF</text>
  </g>

  <!-- Estado 3: Ventilación Forzada -->
  <g transform="translate(470, 270)">
    <rect width="200" height="90" class="state-box" />
    <text x="100" y="32" class="state-title">Ventilación Forzada</text>
    <text x="100" y="52" class="state-desc">T &gt; T_max + 1°C o Hum &gt; Hum_max</text>
    <text x="100" y="68" class="state-desc">Compuerta 90° | Fan 100% (PWM 220)</text>
  </g>

  <!-- Estado 4: Fail-Safe Autónomo de Borde -->
  <g transform="translate(160, 360)">
    <rect width="210" height="90" fill="#fef2f2" stroke="#dc2626" stroke-width="2" rx="8" />
    <text x="105" y="32" font-size="13" font-weight="bold" fill="#b91c1c" text-anchor="middle">Fail-Safe de Borde</text>
    <text x="105" y="52" class="state-desc">Pérdida Wi-Fi o Sensor NaN</text>
    <text x="105" y="68" class="state-desc">Compuerta 45° | Fan Pulsos 120</text>
  </g>

  <!-- Estado 5: Manual Override -->
  <g transform="translate(730, 170)">
    <rect width="150" height="90" fill="#fffbeb" stroke="#d97706" stroke-width="2" rx="8" />
    <text x="75" y="32" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">Manual Override</text>
    <text x="75" y="52" class="state-desc">Admin Force Servo/Fan</text>
    <text x="75" y="68" class="state-desc">Lazo Cerrado Pausado</text>
  </g>

  <!-- Transiciones -->
  <!-- Confort a Pasiva -->
  <path d="M 310 170 Q 380 110 460 100" class="trans-line" fill="none" />
  <text x="340" y="125" class="trans-text">T &gt; T_max</text>

  <!-- Pasiva a Confort -->
  <path d="M 470 135 Q 380 165 345 190" class="trans-line" fill="none" />
  <text x="360" y="160" class="trans-text">T &lt;= T_max</text>

  <!-- Pasiva a Forzada -->
  <line x1="570" y1="150" x2="570" y2="260" class="trans-line" />
  <text x="580" y="210" class="trans-text">Pico Térmico</text>

  <!-- Confort a Forzada -->
  <path d="M 320 260 Q 380 310 460 310" class="trans-line" fill="none" />
  <text x="330" y="315" class="trans-text">Exceso Hum/Temp</text>

  <!-- Forzada a Confort -->
  <path d="M 470 335 Q 360 335 320 240" class="trans-line" fill="none" />
  <text x="350" y="270" class="trans-text">Restablecido</text>

  <!-- A Fail-Safe -->
  <line x1="250" y1="260" x2="250" y2="350" class="trans-line" />
  <text x="160" y="310" class="trans-text">Timeout Wi-Fi &gt; 15s</text>

  <!-- De Fail-Safe a Confort -->
  <path d="M 280 360 Q 300 310 280 265" class="trans-line" fill="none" />
  <text x="290" y="310" class="trans-text">Reconexión</text>

  <!-- A Override -->
  <line x1="670" y1="210" x2="720" y2="210" class="trans-line" />
  <text x="675" y="200" class="trans-text">Admin</text>

  <!-- De Override a Confort -->
  <path d="M 800 260 Q 750 420 375 410" class="trans-line" fill="none" />
  <text x="600" y="430" class="trans-text">Reactivar Auto</text>
</svg>